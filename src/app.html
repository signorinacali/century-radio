<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			try {
				document.querySelector('meta[name="color-scheme"]').content =
					localStorage.getItem('color-scheme') ?? 'light dark';
			} catch {}
		</script>
		<title>Century Radio — 1926 Live Historical AM Broadcast</title>
		<meta
			name="description"
			content="Tune into an authentic 1920s vacuum-tube AM radio broadcast streaming news, weather, and 78rpm music from this exact day 100 years ago."
		/>
		<meta property="og:title" content="Century Radio — 1926 Live Historical AM Broadcast" />
		<meta
			property="og:description"
			content="Interactive 1920s vacuum-tube AM receiver with Web Audio DSP, Gemini-written period broadcasts, Deepgram voice synthesis, and Great 78 Project music."
		/>
		<meta property="og:type" content="website" />
		<meta name="twitter:card" content="summary_large_image" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1917'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23d95d1e' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f59e0b'/%3E%3C/svg%3E"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
